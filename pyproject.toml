[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "mypy>=1.11",
    "pandas-stubs>=2.1.0",
    "pre-commit>=3.6.0",
    "pytest>=8",
    "pytest-cov>=4.1.0",
    "ruff>=0.6",
    "twine>=4.0.0",
]
docs = [
    "myst-parser>=3.0.0",
    "sphinx>=7.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-material>=0.0.35",
]

[tool.ruff]
line-length = 131

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TC", "PTH", "ERA", "PL", "RUF"]
ignore = ["PLR0913", "PLR0911", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**/*" = ["ARG", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["ds_fetch_py_sdk", "ds_fetch_cli"]

[tool.mypy]
strict = true
warn_unreachable = true
packages = ["ds_fetch_py_sdk", "ds_fetch_cli"]
mypy_path = "packages/sdk/src:packages/cli/src"

[tool.pytest.ini_options]
testpaths = ["packages/sdk/tests", "packages/cli/tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.coverage.run]
source = ["ds_fetch_py_sdk", "ds_fetch_cli"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]
