[project]
name = "ds-fetch-cli"
version = "1.0.0"
description = "aic-fetch: the command line for AI Commons Fetch. SQL and natural-language queries over your data lake."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
requires-python = ">=3.11"
authors = [{ name = "AI Commons", email = "hello@grasplabs.com" }]
maintainers = [{ name = "AI Commons", email = "hello@grasplabs.com" }]
keywords = ["aic", "ai-commons", "fetch", "sql", "cli", "data-lake", "text-to-sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "ds-fetch-py-sdk==1.0.0",
    "rich>=13.7,<15.0.0",
    "typer>=0.12,<1.0.0",
]

[project.scripts]
aic-fetch = "ds_fetch_cli.app:run"

[project.urls]
Homepage = "https://aic-project.com"
Documentation = "https://grasp-labs.github.io/ds-fetch-py-sdk/"
Repository = "https://github.com/grasp-labs/ds-fetch-py-sdk/"
Issues = "https://github.com/grasp-labs/ds-fetch-py-sdk/issues/"
Changelog = "https://github.com/grasp-labs/ds-fetch-py-sdk/releases"

[tool.uv.sources]
ds-fetch-py-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
