[project]
name = "ds-fetch-py-sdk"
version = "0.1.0"
description = "Python SDK for AI Commons Fetch: read-only SQL over your tenant data lake."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
requires-python = ">=3.11"
authors = [{ name = "AI Commons", email = "hello@grasplabs.com" }]
maintainers = [{ name = "AI Commons", email = "hello@grasplabs.com" }]
keywords = ["aic", "ai-commons", "fetch", "sql", "duckdb", "data-lake", "text-to-sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1.0.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.2.0,<3.0.0"]

[project.urls]
Homepage = "https://aic-project.com"
Documentation = "https://grasp-labs.github.io/ds-fetch-py-sdk/"
"API reference" = "https://grasp-daas.com/api/fetch/v1/docs/"
Repository = "https://github.com/grasp-labs/ds-fetch-py-sdk/"
Issues = "https://github.com/grasp-labs/ds-fetch-py-sdk/issues/"
Changelog = "https://github.com/grasp-labs/ds-fetch-py-sdk/releases"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
